<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--TITLE--></title>
<meta name="description" content="Имперский Квадроберский Джайнизм — трактат о Свабхаве, Хридае и Пути Служения.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e0906'/%3E%3Cpath d='M50 22 L82 78 L18 78 Z' fill='none' stroke='%23e8c88a' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="ink-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div id="progress-rail" aria-hidden="true"><div id="progress-fill"></div></div>

<nav id="side-nav" aria-label="Книги трактата">
  <!--NAV-->
</nav>

<button id="sound-toggle" aria-label="Переключить фоновый звук" title="Звук">
  <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/></svg>
</button>

<main id="scroll-container">

  <header class="hero" data-mood="source">
    <div class="hero-inner">
      <span class="hero-glyph">△</span>
      <h1 class="hero-title">Имперский<br>Квадроберский<br>Джайнизм</h1>
      <p class="hero-subtitle">Трактат о Свабхаве, Хридае и Пути Служения</p>
      <div class="scroll-cue">
        <span>прокрутите, чтобы войти в русло</span>
        <span class="scroll-cue-line"></span>
      </div>
    </div>
  </header>

  <section class="preamble" id="preamble" data-mood="source">
    <!--PREAMBLE-->
  </section>

  <!--BOOKS-->

  <footer class="site-footer">
    <span class="glyph-line" aria-hidden="true">△</span>
    <p>Имперский Квадроберский Джайнизм</p>
  </footer>

</main>

<!-- p5.js — ink / flow-field background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- Lenis smooth scroll -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>

<script src="js/ink.js"></script>
<script src="js/main.js"></script>
</body>
</html>
